name: Build PS2 ELF
on: [push, workflow_dispatch]
jobs:
  build:
   - name: Install make
        run: apk add --no-cache make git
      - name: Build
        run: make
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: ps2xp-elf
          path: ps2xp.elf
